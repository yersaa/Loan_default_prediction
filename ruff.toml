line-length = 120
extend-exclude = [".venv", "sample_run", "notebook_run", "minimizing-risks-for-loan-investments.ipynb",
                  "lending-club-loan-defaulters-prediction.ipynb", "xgboost-loan-defaulters-prediction.ipynb",
                  "loan-default-prediction.ipynb"]

[lint]
select = ["E", "F", "W", "I", "B", "UP"]
# E402: matplotlib.use("Agg") должен стоять до импорта pyplot
ignore = ["E402"]

[lint.per-file-ignores]
# Сборщики документов содержат абзацы текста отчёта и презентации
"docs/*.py" = ["E501"]
